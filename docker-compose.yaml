services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: prissma
      POSTGRES_USER: prissma
      POSTGRES_PASSWORD: prissma
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - prissma-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prissma -d prissma"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    # O container nao enxerga o .env da raiz sozinho. O env_file injeta as
    # variaveis locais sem versionar credenciais no docker-compose.
    env_file:
      - .env
    environment:
      # Para o Docker Compose local, a aplicacao deve falar com o servico "db".
      # Em Cloud Run, estas variaveis sao configuradas diretamente no servico.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/prissma
      SPRING_DATASOURCE_USERNAME: prissma
      SPRING_DATASOURCE_PASSWORD: prissma
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "0"

    depends_on:
      db:
        condition: service_healthy
    networks:
      - prissma-network

volumes:
  pgdata:
    driver: local

networks:
  prissma-network:
    driver: bridge
