security:
  jwt:
    secret: prissma-secret-key-change-in-production
    expiration: 86400000
  password-reset:
    frontend-url: http://localhost:3000

app:
  admin:
    email: admin@prissma.com
    password: Admin@123
    name: Admin
  storage:
    backend: local
    local:
      root: ./var/storage
    limits:
      max-file-size-bytes: 52428800
      allowed-content-types:
        - application/pdf
        - image/png
        - image/jpeg
        - image/gif
        - image/bmp
        - image/tiff
        - image/webp
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document

openai:
  image:
    # Nunca versione uma chave real. Defina OPENAI_API_KEY no ambiente.
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_IMAGE_MODEL:gpt-image-2}
    max-input-bytes: ${OPENAI_IMAGE_MAX_INPUT_BYTES:20971520}

spring:
  application:
    name: prissma-server
  datasource:
    url: jdbc:postgresql://localhost:5432/prissma
    username: prissma
    password: prissma
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: prissma.noreply@gmail.com
    password: bdhvdckymwzfqezp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  swagger-ui:
    path: /

# O Azure App Service (Linux, Java SE) injeta a porta em PORT e espera que a
# aplicacao escute exatamente nela; o 8080 fixo do Spring Boot faz o health
# check falhar e o container reiniciar em loop. O default mantem o
# comportamento local intacto quando a variavel nao existe.
server:
  port: ${PORT:8080}
