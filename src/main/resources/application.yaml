security:
  jwt:
    secret: ${JWT_SECRET:prissma-secret-key-change-in-production}
    expiration: ${JWT_EXPIRATION:86400000}
  password-reset:
    frontend-url: ${PASSWORD_RESET_FRONTEND_URL:http://localhost:3000}

app:
  admin:
    email: ${APP_ADMIN_EMAIL:admin@prissma.com}
    password: ${APP_ADMIN_PASSWORD:Admin@123}
    name: ${APP_ADMIN_NAME:Admin}
  storage:
    backend: local
    local:
      root: ./var/storage
    limits:
      max-file-size-bytes: 52428800
      allowed-content-types:
        - application/pdf
        - image/png
        - image/jpeg
        - image/gif
        - image/bmp
        - image/tiff
        - image/webp
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document

openai:
  image:
    # Nunca versione uma chave real. Defina OPENAI_API_KEY no ambiente.
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_IMAGE_MODEL:gpt-image-2}
    max-input-bytes: ${OPENAI_IMAGE_MAX_INPUT_BYTES:20971520}

server:
  port: ${PORT:8080}

spring:
  application:
    name: prissma-server
  datasource:
    # Em desenvolvimento local, os defaults continuam apontando para localhost.
    # No Cloud Run, configure estas variaveis com os dados do Neon.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/prissma}
    username: ${SPRING_DATASOURCE_USERNAME:prissma}
    password: ${SPRING_DATASOURCE_PASSWORD:prissma}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:0}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  swagger-ui:
    path: /
