security:
  jwt:
    secret: test-secret-key
    expiration: 86400000
  password-reset:
    frontend-url: http://localhost:3000

spring:
  datasource:
    url: jdbc:h2:mem:prissma_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: localhost
    port: 3025

springdoc:
  swagger-ui:
    path: /

