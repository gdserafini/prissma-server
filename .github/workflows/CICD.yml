name: Build and deploy JAR app to Azure Web App - testjavawebapp
on:
  push:
    branches:
      - release
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: 'maven'
      - name: Grant execute permission for mvnw
        run: chmod +x mvnw
      - name: Build with Maven Wrapper
        run: ./mvnw -B clean package
      - name: Locate executable jar
        id: locate-jar
        run: |
          JAR_PATH=$(find target -maxdepth 1 -name '*.jar' ! -name '*.jar.original' | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "::error::No runnable jar found in target/"
            exit 1
          fi
          echo "Found jar: $JAR_PATH"
          echo "jar-path=$JAR_PATH" >> "$GITHUB_OUTPUT"
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: ${{ steps.locate-jar.outputs.jar-path }}
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'testjavawebapp'
          slot-name: 'Production'
          package: '*.jar'
          publish-profile: ${{ secrets.publish_profile }}